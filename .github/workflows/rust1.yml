name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Dependencies
      run: |
        choco install mingw -y
        set PATH=C:\ProgramData\chocolatey\lib\mingw\tools\install\bin;%PATH%

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Build
      run: cargo build --release --verbose

    - name: Upload Executable
      uses: actions/upload-artifact@v3
      with:
        name: music-ui
        path: target/release/music-ui.exe
